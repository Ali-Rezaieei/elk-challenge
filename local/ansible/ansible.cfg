# ---------------------------------------------------------------------------
# Project-local Ansible configuration. Kept deliberately small; every setting
# here exists to make runs reproducible on a stranger's machine.
# ---------------------------------------------------------------------------
[defaults]
# The inventory is GENERATED by Terraform (local_file) from state, so no human
# ever hand-copies a container name or address between the two layers.
inventory = inventory/hosts.yml

# Vendored collection path keeps `ansible-galaxy install -r requirements.yml`
# self-contained inside the repo instead of polluting the user's home dir.
collections_path = ./collections:~/.ansible/collections

roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
# Show task timing so the reviewer can see where the wall-clock goes.
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
force_color = True

# NOTE on the inventory: it is generated by Terraform. We intentionally do NOT
# set inventory.unparsed_is_failed here, because that would make `ansible-lint`
# fail on a fresh clone (before any deploy) where the generated inventory does
# not exist yet. deploy.sh enforces the "inventory must exist" invariant at run
# time instead (Terraform always writes it before Ansible runs).
