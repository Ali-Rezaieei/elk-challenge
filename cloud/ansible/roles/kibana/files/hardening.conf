# Managed by Ansible. Conservative systemd hardening for the Kibana unit, which
# already runs as the non-root `kibana` user. These directives only remove
# privileges the service never needs, so they cannot break startup.
[Service]
NoNewPrivileges=true
ProtectHome=true
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelModules=true
RestrictSUIDSGID=true
