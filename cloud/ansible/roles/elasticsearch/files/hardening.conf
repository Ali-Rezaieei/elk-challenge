# Managed by Ansible. systemd hardening overlaid on the packaged unit. Kept
# conservative so it cannot break first boot: the service already runs as the
# non-root `elasticsearch` user; these directives only remove privileges it
# never needs.
[Service]
NoNewPrivileges=true
ProtectHome=true
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelModules=true
RestrictSUIDSGID=true
