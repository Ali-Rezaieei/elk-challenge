---
# Native Elasticsearch from the official Elastic APT repo, managed by systemd.
# TLS on the HTTP and transport layers uses the internal CA generated on the
# control node. The elastic superuser password is seeded through the keystore
# BEFORE first boot, so the secret never touches the shell environment or logs.

# --- Elastic APT repository -----------------------------------------------
- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Elastic APT signing key
  ansible.builtin.get_url:
    url: "{{ elastic_apt_key_url }}"
    dest: "{{ elastic_apt_keyring }}"
    mode: "0644"

- name: Add the Elastic 8.x APT repository
  ansible.builtin.apt_repository:
    repo: "{{ elastic_apt_repo }}"
    filename: elastic-8.x
    state: present

# --- Install (pinned) ------------------------------------------------------
- name: Install Elasticsearch (version-pinned for reproducibility)
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_stack_version }}"
    state: present
    update_cache: true

- name: Hold the elasticsearch package so an unattended upgrade cannot bump it
  ansible.builtin.dpkg_selections:
    name: elasticsearch
    selection: hold

# --- TLS material ----------------------------------------------------------
- name: Ensure the ES certs directory exists
  ansible.builtin.file:
    path: "{{ es_certs_dir }}"
    state: directory
    owner: root
    group: elasticsearch
    mode: "0750"

- name: Install CA + node TLS material
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ es_certs_dir }}/{{ item.dest }}"
    owner: root
    group: elasticsearch
    mode: "0640"
  loop:
    - { src: "ca.crt", dest: "ca.crt" }
    - { src: "elasticsearch.crt", dest: "es.crt" }
    - { src: "elasticsearch.key", dest: "es.key" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart elasticsearch

# --- Configuration ---------------------------------------------------------
- name: Render elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ es_config_dir }}/elasticsearch.yml"
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Restart elasticsearch

- name: Pin the JVM heap via jvm.options.d (paired with the server's RAM)
  ansible.builtin.copy:
    dest: "{{ es_config_dir }}/jvm.options.d/heap.options"
    content: |
      # Managed by Ansible - do not edit by hand.
      -Xms{{ elasticsearch_heap_size }}
      -Xmx{{ elasticsearch_heap_size }}
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: Restart elasticsearch

# --- systemd hardening (unit override) -------------------------------------
- name: Create the systemd override directory for elasticsearch
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    mode: "0755"

- name: Install the systemd hardening override
  ansible.builtin.copy:
    src: hardening.conf
    dest: /etc/systemd/system/elasticsearch.service.d/hardening.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart elasticsearch

# --- Seed the elastic superuser password (first run only) ------------------
# bootstrap.password is consumed on the FIRST start, when the security index is
# created. Setting it here keeps the secret out of Terraform state and out of
# the service environment. Guarded so re-runs are a no-op.
- name: Ensure the Elasticsearch keystore exists
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-keystore create
    creates: "{{ es_config_dir }}/elasticsearch.keystore"
  environment:
    ES_PATH_CONF: "{{ es_config_dir }}"

- name: Seed the elastic bootstrap password into the ES keystore (first run only)
  ansible.builtin.shell: |
    set -euo pipefail
    export ES_PATH_CONF={{ es_config_dir }}
    KS=/usr/share/elasticsearch/bin/elasticsearch-keystore
    if $KS list 2>/dev/null | grep -qx 'bootstrap.password'; then
      echo OK_EXISTS
    else
      printf '%s' '{{ es_elastic_password }}' | $KS add --stdin --force bootstrap.password
      echo OK_CREATED
    fi
  args:
    executable: /bin/bash
  register: elasticsearch_keystore
  changed_when: "'OK_CREATED' in elasticsearch_keystore.stdout"
  no_log: true

- name: Ensure the keystore is readable by the elasticsearch group
  ansible.builtin.file:
    path: "{{ es_config_dir }}/elasticsearch.keystore"
    owner: root
    group: elasticsearch
    mode: "0660"

# --- Start + apply any pending config changes before the readiness gate -----
- name: Enable and start Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true

- name: Apply any pending restart now (so health reflects the current config)
  ansible.builtin.meta: flush_handlers

# --- Readiness gate: real cluster health over TLS (never a bare sleep) ------
- name: Wait for Elasticsearch to reach green or yellow
  block:
    - name: Poll the cluster health API (validating the internal CA)
      ansible.builtin.uri:
        url: "https://localhost:{{ elasticsearch_http_port }}/_cluster/health?wait_for_status=yellow&timeout=5s"
        user: elastic
        password: "{{ es_elastic_password }}"
        force_basic_auth: true
        validate_certs: true
        ca_path: "{{ es_certs_dir }}/ca.crt"
        return_content: true
      register: elasticsearch_health
      until: elasticsearch_health.status == 200 and (elasticsearch_health.json.status in ['green', 'yellow'])
      retries: "{{ es_health_retries }}"
      delay: "{{ es_health_delay }}"
      no_log: true
  rescue:
    - name: Report a useful readiness timeout instead of a raw stack trace
      ansible.builtin.fail:
        msg: >-
          Elasticsearch did not become healthy within
          {{ es_health_retries | int * es_health_delay | int }}s.
          Inspect on the server:  journalctl -u elasticsearch --no-pager | tail -n 100

# --- Set the kibana_system password so Kibana can authenticate --------------
# Guarded: only (re)set when ES actively rejects the current one (401/403). A
# 200 means it is already correct -> no-op, so re-runs report changed=0.
- name: Check whether kibana_system already authenticates
  ansible.builtin.uri:
    url: "https://localhost:{{ elasticsearch_http_port }}/_security/_authenticate"
    user: kibana_system
    password: "{{ es_kibana_system_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ es_certs_dir }}/ca.crt"
    status_code: [200, 401, 403]
  register: elasticsearch_kibana_auth
  no_log: true

- name: Set the kibana_system password via the ES security API
  ansible.builtin.uri:
    url: "https://localhost:{{ elasticsearch_http_port }}/_security/user/kibana_system/_password"
    method: POST
    user: elastic
    password: "{{ es_elastic_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ es_certs_dir }}/ca.crt"
    body_format: json
    body:
      password: "{{ es_kibana_system_password }}"
    status_code: 200
  when: elasticsearch_kibana_auth.status in [401, 403]
  no_log: true
