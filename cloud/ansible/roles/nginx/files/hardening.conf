# Managed by Ansible. Conservative systemd hardening for nginx. The master
# process must stay root to bind 443 and drop to www-data for workers, so we
# keep directives that do not interfere with that.
[Service]
ProtectHome=true
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelModules=true
RestrictSUIDSGID=true
