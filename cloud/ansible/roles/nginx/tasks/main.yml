---
# Native nginx TLS edge, managed by systemd. It is the ONLY public-facing
# service (443). It terminates TLS with the internal CA's edge certificate and
# reverse-proxies to Kibana (/) and Elasticsearch (/es/) over HTTPS, verifying
# the internal CA on every hop.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- TLS material ----------------------------------------------------------
- name: Ensure the nginx certs directory exists
  ansible.builtin.file:
    path: "{{ nginx_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install CA + edge TLS material
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ nginx_certs_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - { src: "ca.crt", dest: "ca.crt" }
    - { src: "nginx.crt", dest: "nginx.crt" }
    - { src: "nginx.key", dest: "nginx.key" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Reload nginx

# --- Configuration ---------------------------------------------------------
- name: Remove the packaged default site (we serve only our vhost)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Render the reverse-proxy vhost
  ansible.builtin.template:
    src: elk.conf.j2
    dest: /etc/nginx/conf.d/elk.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c /etc/nginx/nginx.conf"
  notify: Reload nginx

# --- systemd hardening (unit override) -------------------------------------
- name: Create the systemd override directory for nginx
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"

- name: Install the systemd hardening override
  ansible.builtin.copy:
    src: hardening.conf
    dest: /etc/systemd/system/nginx.service.d/hardening.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart nginx

# --- Start + apply pending changes before the edge readiness gate -----------
- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true

- name: Apply any pending reload/restart now
  ansible.builtin.meta: flush_handlers

# --- Readiness gate: the HTTPS edge actually serves content -----------------
# validate_certs is off here only because the edge cert's SAN is the public IP,
# not 127.0.0.1; verify.sh does the strict CA + SAN check against the public IP.
- name: Wait for the HTTPS edge to serve content
  ansible.builtin.uri:
    url: "https://127.0.0.1/"
    method: GET
    validate_certs: false
    status_code: [200, 302]
  register: nginx_edge
  until: nginx_edge.status in [200, 302]
  retries: 30
  delay: 5
