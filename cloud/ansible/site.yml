---
# ===========================================================================
# CONFIGURATION ONLY (Hetzner Cloud).
#
# Terraform has already created the server and written this inventory from
# state. cloud-init ran once at first boot (admin user, SSH hardening,
# vm.max_map_count, python3) and nothing else. This playbook does all service
# configuration on native packages, ordered strictly:
#   CA/secrets (control node) -> Elasticsearch -> Kibana -> nginx edge
# because each layer depends on the previous being genuinely ready (not merely
# "started"): Kibana authenticates to ES; nginx proxies to both.
#
# Ordering is explicitly GATED, never guessed:
#   server exists (Terraform) -> SSH reachable (wait_for_connection)
#   -> cloud-init finished (cloud-init status --wait) -> Ansible configures.
# ===========================================================================

- name: Generate internal CA, TLS certificates and deploy secrets
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [ca, pki]
  roles:
    - role: ca

- name: Configure the ELK stack on the server
  hosts: elk
  become: true
  gather_facts: false
  any_errors_fatal: true

  # --- Ordering gate: prove the server is genuinely ready before touching it.
  pre_tasks:
    - name: Wait until SSH is reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Block until cloud-init has finished (any final state)
      ansible.builtin.command: cloud-init status --wait
      register: cloudinit
      changed_when: false
      # Do not fail on the exit code: a stock module we do not depend on can
      # flip the global status to "error" while our bootstrap still completed.
      # The marker below is the authoritative readiness gate.
      failed_when: false

    - name: Require the first-boot completion marker (authoritative readiness gate)
      ansible.builtin.wait_for:
        path: /var/lib/provision/cloud-init-done
        state: present
        timeout: 300
      # Present  => our runcmd finished (packages installed, sysctl applied) and
      #             the box is ready for Ansible.
      # Missing  => first boot genuinely did not complete; fail loudly here
      #             rather than limping into a half-provisioned configuration.

    - name: Record cloud-init's final status for the log
      ansible.builtin.debug:
        msg: >-
          cloud-init reported '{{ cloudinit.stdout | default('unknown') | trim }}';
          first-boot marker present, proceeding.

    - name: Gather facts now that the host is provisioned
      ansible.builtin.setup:

  # Roles run sequentially: each finishes its readiness gate before the next
  # starts, so Elasticsearch is truly green/yellow before Kibana is configured,
  # and Kibana is truly "available" before the nginx edge is verified.
  roles:
    - role: elasticsearch
    - role: kibana
    - role: nginx
